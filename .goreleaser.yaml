version: 2

project_name: cf

builds:
  - id: cf
    main: ./cmd/cf
    binary: cf
    env:
      - CGO_ENABLED=0
    goos: [darwin, linux, windows]
    goarch: [amd64, arm64]
    ignore:
      - goos: windows
        goarch: arm64
    ldflags:
      - -s -w -X github.com/trmdy/cf-cli/internal/cli.Version={{ .Version }}

archives:
  - id: cf
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files: [LICENSE*, README.md]

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  filters:
    exclude:
      - "^Review record"
      - "^Wave .* retrospective"

release:
  draft: false
  footer: |
    ## Install

    ```sh
    brew install trmdy/tap/cf   # macOS/Linux
    go install github.com/trmdy/cf-cli/cmd/cf@{{ .Tag }}
    ```
